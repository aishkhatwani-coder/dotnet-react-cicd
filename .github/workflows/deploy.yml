name: CI/CD GitHub Actions Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 3. Build Code
      run: |
        dotnet build BackendApp/BackendApp.csproj --configuration Release

    - name: 4. Deploy via Jump Server
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        JUMP_HOST: ${{ secrets.JUMP_HOST }}
        USER: ${{ secrets.SERVER_USER }}
      run: |
        mkdir -p ~/.ssh
        printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        ssh -o StrictHostKeyChecking=no $USER@$JUMP_HOST "ssh -o StrictHostKeyChecking=no ubuntu@10.0.0.19 'sudo systemctl is-active postgresql && cd ~/my-app && git pull origin main'"
        echo "Deployment successful via GitHub Actions!"
